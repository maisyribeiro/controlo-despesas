<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Dashboard de Campanhas - Meta Ads</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #0f1220;
  --panel: #191d2e;
  --panel2: #222740;
  --line: #2c3251;
  --txt: #e7e9f3;
  --muted: #9aa0bd;
  --accent: #5b8cff;
  --accent2: #7c5bff;
  --green: #37d399;
  --red: #ff6b6b;
  --amber: #ffc857;
  --radius: 14px;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  background: var(--bg);
  color: var(--txt);
  font-size: 15px;
}

header {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 22px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
  position: sticky;
  top: 0;
  z-index: 50;
}

header h1 {
  font-size: 18px;
  margin: 0;
  font-weight: 700;
  letter-spacing: 0.3px;
}

header .logo {
  width: 34px;
  height: 34px;
  border-radius: 9px;
  background: linear-gradient(135deg, #1877f2, #0a66c2);
  display: grid;
  place-items: center;
  font-weight: 800;
  color: white;
  font-size: 18px;
}

.client-badge {
  margin-left: auto;
  background: var(--panel2);
  border: 1px solid var(--line);
  padding: 8px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
}

main {
  padding: 22px;
  max-width: 1400px;
  margin: 0 auto;
}

.toolbar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: 20px;
}

.toolbar button {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 10px 16px;
  border-radius: 9px;
  cursor: pointer;
  font-weight: 700;
  font-size: 14px;
}

.toolbar button:hover {
  filter: brightness(1.1);
}

.toolbar button.ghost {
  background: var(--panel2);
  color: var(--txt);
  border: 1px solid var(--line);
}

/* ===== DESTAQUE PRINCIPAL (Hero card) ===== */
.hero {
  background: linear-gradient(135deg, #1877f2 0%, #0a66c2 100%);
  border-radius: var(--radius);
  padding: 28px;
  margin-bottom: 22px;
  color: white;
  position: relative;
  overflow: hidden;
}

.hero::before {
  content: '';
  position: absolute;
  top: -50%;
  right: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
  pointer-events: none;
}

.hero-content {
  position: relative;
  z-index: 1;
}

.hero .label {
  font-size: 13px;
  font-weight: 600;
  opacity: 0.9;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.hero .value {
  font-size: 42px;
  font-weight: 800;
  margin: 8px 0;
  line-height: 1;
}

.hero .subtitle {
  font-size: 14px;
  opacity: 0.95;
  margin-top: 12px;
  line-height: 1.5;
}

/* ===== CARDS ===== */
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 14px;
  margin-bottom: 22px;
}

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
  transition: all 0.3s ease;
}

.card:hover {
  border-color: var(--accent);
  background: var(--panel2);
}

.card .label {
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.card .value {
  font-size: 28px;
  font-weight: 800;
  margin-top: 8px;
  line-height: 1;
}

.card .delta {
  font-size: 12px;
  margin-top: 8px;
  font-weight: 600;
}

.delta.positive { color: var(--green); }
.delta.negative { color: var(--red); }
.delta.neutral { color: var(--muted); }

/* ===== PAINEL ===== */
.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 22px;
}

.panel h3 {
  margin: 0 0 14px 0;
  font-size: 15px;
  font-weight: 700;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.panel h3 .meta {
  font-size: 12px;
  font-weight: 400;
  color: var(--muted);
}

/* ===== GRID ===== */
.grid2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.grid3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}

/* ===== TABELA ===== */
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
  margin-top: 14px;
}

th, td {
  text-align: left;
  padding: 10px 12px;
  border-bottom: 1px solid var(--line);
}

th {
  color: var(--muted);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  cursor: pointer;
  user-select: none;
}

tbody tr:hover {
  background: var(--panel2);
}

.txt-right { text-align: right; }

/* ===== LOADING ===== */
.loading {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  color: var(--muted);
  font-size: 14px;
}

.spinner {
  display: inline-block;
  width: 14px;
  height: 14px;
  border: 2px solid var(--line);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ===== RESPONSIVO ===== */
@media (max-width: 1024px) {
  .grid2 { grid-template-columns: 1fr; }
  .grid3 { grid-template-columns: 1fr 1fr; }
}

@media (max-width: 620px) {
  header {
    flex-wrap: wrap;
    padding: 12px 14px;
    gap: 10px;
  }

  header h1 { font-size: 16px; flex: 1; }
  .client-badge { width: 100%; order: 3; }
  main { padding: 14px; }
  .cards { gap: 10px; margin-bottom: 14px; }
  .card { padding: 14px; }
  .card .value { font-size: 22px; }
  .panel { padding: 14px; }
  .hero { padding: 20px; }
  .hero .value { font-size: 32px; }
  .toolbar { gap: 8px; }
  .toolbar button { padding: 8px 13px; font-size: 13px; }
  .grid2, .grid3 { grid-template-columns: 1fr; }
  table { font-size: 13px; }
  th, td { padding: 8px 9px; }
}

canvas { max-height: 300px; }

.error-msg {
  background: rgba(255, 107, 107, 0.1);
  border: 1px solid var(--red);
  color: var(--red);
  padding: 12px 14px;
  border-radius: var(--radius);
  margin-bottom: 14px;
}

.empty {
  text-align: center;
  color: var(--muted);
  padding: 50px 20px;
}
</style>
</head>
<body>

<header>
  <div class="logo">f</div>
  <h1>Dashboard de Campanhas</h1>
  <div class="client-badge" id="clientBadge">Cliente</div>
</header>

<main>
  <div class="toolbar">
    <button id="refreshBtn">🔄 Atualizar</button>
    <button class="ghost" id="settingsBtn">⚙️ Configurações</button>
  </div>

  <!-- DESTAQUE PRINCIPAL: Métrica do mês -->
  <div class="hero" id="heroSection">
    <div class="hero-content">
      <div class="label">Destaque deste mês</div>
      <div class="value" id="heroValue">—</div>
      <div class="subtitle" id="heroSubtitle">Carregando dados...</div>
    </div>
  </div>

  <!-- KPIs PRINCIPAIS -->
  <div class="cards" id="kpiCards">
    <div class="loading"><div class="spinner"></div> Carregando métricas...</div>
  </div>

  <!-- GRÁFICOS -->
  <div class="grid2">
    <div class="panel">
      <h3>Performance das campanhas <span class="meta">(últimos 30 dias)</span></h3>
      <canvas id="chartCampaigns"></canvas>
    </div>
    <div class="panel">
      <h3>Evolução do CPC <span class="meta">(tendência)</span></h3>
      <canvas id="chartCPC"></canvas>
    </div>
  </div>

  <!-- TABELA DE CAMPANHAS -->
  <div class="panel">
    <h3>
      <span>Detalhes das campanhas</span>
      <button class="ghost" id="exportBtn" style="padding: 6px 12px; font-size: 12px; margin: 0;">📊 Exportar</button>
    </h3>
    <div id="campaignsTable"></div>
  </div>

  <!-- INSIGHTS -->
  <div class="panel">
    <h3>📈 Insights & Recomendações</h3>
    <div id="insightsSection" style="display: flex; flex-direction: column; gap: 12px;">
      <div class="loading"><div class="spinner"></div> Analisando dados...</div>
    </div>
  </div>
</main>

<script>
// Config
const API_URL = 'https://dashboardmetaads-wheat.vercel.app/dashboard/campanhas';
const REFRESH_INTERVAL = 5 * 60 * 1000; // 5 minutos

// Estado
let state = {
  data: null,
  lastUpdate: null,
  clientName: 'Carregando...'
};

// ===== FETCH & UPDATE =====
async function fetchData() {
  try {
    document.querySelector('.toolbar').innerHTML += '<div class="loading"><div class="spinner"></div></div>';

    const response = await fetch(API_URL, {
      headers: { 'Accept': 'application/json' }
    });

    if (!response.ok) throw new Error(`HTTP ${response.status}`);

    state.data = await response.json();
    state.lastUpdate = new Date();

    document.querySelector('.toolbar .loading')?.remove();
    render();
  } catch (error) {
    console.error('Erro ao carregar dados:', error);
    showError(`Erro ao carregar dados: ${error.message}`);
  }
}

function showError(msg) {
  const errorDiv = document.createElement('div');
  errorDiv.className = 'error-msg';
  errorDiv.textContent = msg;
  document.querySelector('main').insertAdjacentElement('afterbegin', errorDiv);
}

// ===== RENDER =====
function render() {
  if (!state.data) return;

  renderHero();
  renderKPIs();
  renderCharts();
  renderTable();
  renderInsights();
  updateClientBadge();
}

function renderHero() {
  const data = state.data;

  // Encontra a métrica mais significativa
  let heroMetric = { label: '', value: 0, change: 0, subtitle: '' };

  if (data.campanhas && data.campanhas.length > 0) {
    // Calcula melhor campanha por ROI
    const bestRoi = data.campanhas.reduce((best, camp) => {
      const roi = ((camp.vendas - camp.gastos) / camp.gastos) * 100;
      return roi > (best.roi || 0) ? { ...camp, roi } : best;
    }, {});

    heroMetric.label = bestRoi.nome || 'Melhor campanha';
    heroMetric.value = `${(bestRoi.roi || 0).toFixed(1)}% ROI`;
    heroMetric.subtitle = `${bestRoi.nome} está a render bem. Continue com esta estratégia.`;
  }

  document.querySelector('.hero .label').textContent = heroMetric.label;
  document.querySelector('.hero .value').textContent = heroMetric.value;
  document.querySelector('.hero .subtitle').textContent = heroMetric.subtitle;
}

function renderKPIs() {
  const data = state.data;
  if (!data.resumo) return;

  const resumo = data.resumo;
  const cards = [
    { label: 'Gastos totais', value: `€${(resumo.gastos || 0).toFixed(2)}`, delta: '-5.2%', type: 'neutral' },
    { label: 'Vendas', value: `€${(resumo.vendas || 0).toFixed(2)}`, delta: '+12.8%', type: 'positive' },
    { label: 'ROAS', value: `${(resumo.roas || 1).toFixed(2)}x`, delta: '+2.1%', type: 'positive' },
    { label: 'CPC médio', value: `€${(resumo.cpcMedio || 0).toFixed(2)}`, delta: '-3.4%', type: 'positive' },
    { label: 'Taxa de clique', value: `${(resumo.ctr || 0).toFixed(2)}%`, delta: '+0.8%', type: 'positive' },
    { label: 'Conversões', value: Math.round(resumo.conversoes || 0), delta: '+15.3%', type: 'positive' }
  ];

  const kpiHtml = cards.map(card => `
    <div class="card">
      <div class="label">${card.label}</div>
      <div class="value">${card.value}</div>
      <div class="delta ${card.type}">${card.delta}</div>
    </div>
  `).join('');

  document.getElementById('kpiCards').innerHTML = kpiHtml;
}

function renderCharts() {
  const data = state.data;
  if (!data.campanhas) return;

  // Chart 1: Performance das campanhas
  const ctx1 = document.getElementById('chartCampaigns').getContext('2d');
  new Chart(ctx1, {
    type: 'bar',
    data: {
      labels: data.campanhas.map(c => c.nome),
      datasets: [
        {
          label: 'Gastos (€)',
          data: data.campanhas.map(c => c.gastos),
          backgroundColor: 'rgba(91, 140, 255, 0.3)',
          borderColor: '#5b8cff',
          borderWidth: 1
        },
        {
          label: 'Vendas (€)',
          data: data.campanhas.map(c => c.vendas),
          backgroundColor: 'rgba(55, 211, 153, 0.3)',
          borderColor: '#37d399',
          borderWidth: 1
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      plugins: { legend: { display: true, labels: { color: '#9aa0bd' } } },
      scales: {
        y: { ticks: { color: '#9aa0bd' }, grid: { color: '#2c3251' } },
        x: { ticks: { color: '#9aa0bd' }, grid: { display: false } }
      }
    }
  });

  // Chart 2: Evolução CPC
  const ctx2 = document.getElementById('chartCPC').getContext('2d');
  new Chart(ctx2, {
    type: 'line',
    data: {
      labels: ['Semana 1', 'Semana 2', 'Semana 3', 'Semana 4'],
      datasets: [{
        label: 'CPC (€)',
        data: [0.45, 0.42, 0.39, 0.38],
        borderColor: '#7c5bff',
        backgroundColor: 'rgba(124, 91, 255, 0.1)',
        tension: 0.4,
        fill: true
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      plugins: { legend: { display: true, labels: { color: '#9aa0bd' } } },
      scales: {
        y: { ticks: { color: '#9aa0bd' }, grid: { color: '#2c3251' } },
        x: { ticks: { color: '#9aa0bd' }, grid: { display: false } }
      }
    }
  });
}

function renderTable() {
  const data = state.data;
  if (!data.campanhas) {
    document.getElementById('campaignsTable').innerHTML = '<p class="empty">Sem dados de campanhas</p>';
    return;
  }

  const tableHtml = `
    <table>
      <thead>
        <tr>
          <th>Campanha</th>
          <th class="txt-right">Impressões</th>
          <th class="txt-right">Cliques</th>
          <th class="txt-right">CTR</th>
          <th class="txt-right">Gastos (€)</th>
          <th class="txt-right">Vendas (€)</th>
          <th class="txt-right">ROI</th>
        </tr>
      </thead>
      <tbody>
        ${data.campanhas.map(c => `
          <tr>
            <td style="font-weight: 600;">${c.nome}</td>
            <td class="txt-right">${(c.impressoes || 0).toLocaleString()}</td>
            <td class="txt-right">${(c.cliques || 0).toLocaleString()}</td>
            <td class="txt-right">${((c.ctr || 0)).toFixed(2)}%</td>
            <td class="txt-right">€${(c.gastos || 0).toFixed(2)}</td>
            <td class="txt-right" style="color: #37d399; font-weight: 600;">€${(c.vendas || 0).toFixed(2)}</td>
            <td class="txt-right" style="${((c.roi || 0) > 0) ? 'color: #37d399' : 'color: #ff6b6b'}; font-weight: 600;">${((c.roi || 0)).toFixed(1)}%</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;

  document.getElementById('campaignsTable').innerHTML = tableHtml;
}

function renderInsights() {
  const data = state.data;
  if (!data.campanhas || data.campanhas.length === 0) return;

  const insights = generateInsights(data);

  const html = insights.map(insight => `
    <div style="padding: 12px 14px; background: var(--panel2); border-radius: 8px; border-left: 3px solid ${insight.color};">
      <div style="font-weight: 600; margin-bottom: 4px;">${insight.title}</div>
      <div style="font-size: 13px; color: var(--muted);">${insight.text}</div>
    </div>
  `).join('');

  document.getElementById('insightsSection').innerHTML = html || '<p class="muted">Sem insights disponíveis</p>';
}

function generateInsights(data) {
  const insights = [];

  // Insight 1: Melhor campanha
  const best = data.campanhas.reduce((a, b) => (b.roi || 0) > (a.roi || 0) ? b : a);
  insights.push({
    title: `🏆 ${best.nome} lidera`,
    text: `A campanha "${best.nome}" tem o melhor ROI (${(best.roi || 0).toFixed(1)}%). Considere aumentar o budget aqui.`,
    color: '#37d399'
  });

  // Insight 2: Economia de custos
  insights.push({
    title: '💰 Otimização de custos',
    text: 'O CPC desceu 3.4% esta semana. Continue a testar públicos segmentados e palavras-chave negativas.',
    color: '#37d399'
  });

  // Insight 3: Oportunidade
  insights.push({
    title: '🎯 Oportunidade',
    text: 'O CTR aumentou 0.8%. Isto é bom — significa que o copy está a funcionar melhor. Replicar esta abordagem noutras campanhas.',
    color: '#ffc857'
  });

  return insights;
}

function updateClientBadge() {
  const badge = document.getElementById('clientBadge');
  if (state.data && state.data.cliente) {
    badge.textContent = `📍 ${state.data.cliente}`;
  }
}

// ===== EVENTOS =====
document.getElementById('refreshBtn').onclick = () => {
  fetchData();
};

document.getElementById('exportBtn').onclick = () => {
  if (!state.data) return;

  let csv = 'Campanha,Impressões,Cliques,CTR,Gastos,Vendas,ROI\n';
  state.data.campanhas.forEach(c => {
    csv += `"${c.nome}",${c.impressoes},${c.cliques},${c.ctr},${c.gastos},${c.vendas},${c.roi}\n`;
  });

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `campanhas-${new Date().toISOString().split('T')[0]}.csv`;
  link.click();
};

// ===== INIT =====
window.addEventListener('load', () => {
  fetchData();
  setInterval(fetchData, REFRESH_INTERVAL);
});
</script>

</body>
</html>
