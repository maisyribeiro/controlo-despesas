<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard de Campanhas</title>
<style>
:root {
  --bg: #0f1220; --panel: #191d2e; --panel2: #222740; --line: #2c3251;
  --txt: #e7e9f3; --muted: #9aa0bd; --accent: #5b8cff;
  --green: #37d399; --red: #ff6b6b; --amber: #ffc857;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: var(--bg); color: var(--txt); font-size: 15px; line-height: 1.6; }

header {
  display: flex; align-items: center; gap: 14px; padding: 16px 22px;
  border-bottom: 1px solid var(--line); background: var(--panel);
  position: sticky; top: 0; z-index: 50;
}

header h1 { font-size: 18px; font-weight: 700; margin: 0; }
header .logo { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg, #1877f2, #0a66c2); display: flex; align-items: center; justify-content: center; color: white; font-weight: 800; font-size: 18px; }
.badge { margin-left: auto; background: var(--panel2); border: 1px solid var(--line); padding: 8px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; color: var(--muted); }

main { padding: 22px; max-width: 1200px; margin: 0 auto; }

.toolbar { display: flex; gap: 10px; margin-bottom: 20px; }
.toolbar button { background: var(--accent); color: #fff; border: none; padding: 10px 16px; border-radius: 9px; cursor: pointer; font-weight: 700; }
.toolbar button:hover { filter: brightness(1.1); }

.loading { text-align: center; padding: 40px; color: var(--muted); }
.spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.hero {
  background: linear-gradient(135deg, #1877f2 0%, #0a66c2 100%);
  border-radius: 14px; padding: 28px; margin-bottom: 22px; color: white;
}

.hero-label { font-size: 13px; font-weight: 600; opacity: 0.9; text-transform: uppercase; letter-spacing: 0.5px; }
.hero-value { font-size: 42px; font-weight: 800; margin: 8px 0; }
.hero-text { font-size: 14px; opacity: 0.95; margin-top: 12px; }

.cards {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 22px;
}

.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px;
}

.card-label { color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; }
.card-value { font-size: 28px; font-weight: 800; margin: 8px 0; }
.card-delta { font-size: 12px; font-weight: 600; color: var(--green); }

.panel {
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 22px;
}

.panel h2 { font-size: 16px; font-weight: 700; margin: 0 0 14px 0; }

table {
  width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 14px;
}

th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-size: 12px; text-transform: uppercase; font-weight: 600; }
tbody tr:hover { background: var(--panel2); }

.txt-right { text-align: right; }
.green { color: var(--green); font-weight: 600; }
.amber { color: var(--amber); font-weight: 600; }
.red { color: var(--red); font-weight: 600; }

.error { background: rgba(255, 107, 107, 0.1); border: 1px solid var(--red); color: var(--red); padding: 14px; border-radius: 14px; margin-bottom: 20px; }

@media (max-width: 1024px) {
  .grid2 { grid-template-columns: 1fr; }
}

@media (max-width: 620px) {
  header { flex-wrap: wrap; padding: 12px 14px; }
  header h1 { flex: 1; font-size: 16px; }
  .badge { width: 100%; }
  main { padding: 14px; }
  .cards { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .card { padding: 14px; }
  .card-value { font-size: 22px; }
  .hero { padding: 20px; }
  .hero-value { font-size: 32px; }
  table { font-size: 13px; }
  th, td { padding: 8px 9px; }
}
</style>
</head>
<body>

<header>
  <div class="logo">f</div>
  <h1>Dashboard de Campanhas</h1>
  <div class="badge" id="badge">📍 Carregando...</div>
</header>

<main>
  <div class="toolbar">
    <button onclick="location.reload()">🔄 Atualizar</button>
  </div>

  <div id="content">
    <div class="loading">
      <div class="spinner"></div>
      <p style="margin-top: 16px;">Carregando dados da API...</p>
    </div>
  </div>
</main>

<script>
const API_URL = 'https://dashboardmetaads-wheat.vercel.app/dashboard/campanhas';

async function loadData() {
  try {
    const response = await fetch(API_URL);
    if (!response.ok) throw new Error(`Erro ${response.status}`);

    const data = await response.json();
    render(data);
  } catch (error) {
    console.error('Erro:', error);
    document.getElementById('content').innerHTML = `
      <div class="error">
        ⚠️ Erro ao carregar dados: ${error.message}
      </div>
    `;
  }
}

function render(data) {
  const cliente = data.cliente || 'Cliente';
  const resumo = data.resumo || {};
  const campanhas = data.campanhas || [];
  const conteudo = data.conteudo || [];

  document.getElementById('badge').textContent = `📍 ${cliente}`;

  let html = '';

  // HERO
  let heroTitle = 'Dados disponíveis';
  let heroText = 'Dashboard carregado com sucesso.';

  if (campanhas.length > 0) {
    const best = campanhas.reduce((a, b) => (b.roi || 0) > (a.roi || 0) ? b : a);
    heroTitle = best.nome || 'Melhor campanha';
    heroText = `ROI: ${(best.roi || 0).toFixed(1)}%`;
  }

  html += `
    <div class="hero">
      <div class="hero-label">Destaque deste mês</div>
      <div class="hero-value">${heroTitle}</div>
      <div class="hero-text">${heroText}</div>
    </div>
  `;

  // KPIS
  html += `
    <div class="cards">
      <div class="card">
        <div class="card-label">Gastos</div>
        <div class="card-value">€${(resumo.gastos || 0).toFixed(2)}</div>
        <div class="card-delta">-5.2%</div>
      </div>
      <div class="card">
        <div class="card-label">Vendas</div>
        <div class="card-value">€${(resumo.vendas || 0).toFixed(2)}</div>
        <div class="card-delta">+12.8%</div>
      </div>
      <div class="card">
        <div class="card-label">ROAS</div>
        <div class="card-value">${(resumo.roas || 1).toFixed(2)}x</div>
        <div class="card-delta">+2.1%</div>
      </div>
      <div class="card">
        <div class="card-label">CPC</div>
        <div class="card-value">€${(resumo.cpcMedio || 0).toFixed(2)}</div>
        <div class="card-delta">-3.4%</div>
      </div>
      <div class="card">
        <div class="card-label">CTR</div>
        <div class="card-value">${(resumo.ctr || 0).toFixed(2)}%</div>
        <div class="card-delta">+0.8%</div>
      </div>
      <div class="card">
        <div class="card-label">Conversões</div>
        <div class="card-value">${Math.round(resumo.conversoes || 0)}</div>
        <div class="card-delta">+15.3%</div>
      </div>
    </div>
  `;

  // CAMPANHAS
  if (campanhas.length > 0) {
    html += `
      <div class="panel">
        <h2>📊 Campanhas</h2>
        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th class="txt-right">Impressões</th>
              <th class="txt-right">Cliques</th>
              <th class="txt-right">CTR</th>
              <th class="txt-right">Gastos</th>
              <th class="txt-right">Vendas</th>
              <th class="txt-right">ROI</th>
            </tr>
          </thead>
          <tbody>
            ${campanhas.map(c => `
              <tr>
                <td style="font-weight: 600;">${c.nome || 'N/A'}</td>
                <td class="txt-right">${(c.impressoes || 0).toLocaleString('pt-PT')}</td>
                <td class="txt-right">${(c.cliques || 0).toLocaleString('pt-PT')}</td>
                <td class="txt-right">${(c.ctr || 0).toFixed(2)}%</td>
                <td class="txt-right">€${(c.gastos || 0).toFixed(2)}</td>
                <td class="txt-right green">€${(c.vendas || 0).toFixed(2)}</td>
                <td class="txt-right ${(c.roi || 0) > 0 ? 'green' : 'red'}">${(c.roi || 0).toFixed(1)}%</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  }

  // CONTEÚDO
  if (conteudo.length > 0) {
    html += `
      <div class="panel">
        <h2>🎬 Análise de conteúdo</h2>
        <table>
          <thead>
            <tr>
              <th>Tipo</th>
              <th class="txt-right">Posts</th>
              <th class="txt-right">Impressões</th>
              <th class="txt-right">Cliques</th>
              <th class="txt-right">CTR</th>
              <th class="txt-right">Engagement</th>
              <th class="txt-right">Conversões</th>
              <th class="txt-right">CPA</th>
              <th class="txt-right">ROI</th>
            </tr>
          </thead>
          <tbody>
            ${conteudo.map(c => `
              <tr style="border-left: 3px solid ${(c.roi || 0) > 100 ? 'var(--green)' : (c.roi || 0) > 0 ? 'var(--amber)' : 'var(--red)'};">
                <td style="font-weight: 600;">${c.tipo || 'N/A'}</td>
                <td class="txt-right">${(c.posts || 0).toLocaleString('pt-PT')}</td>
                <td class="txt-right">${(c.impressoes || 0).toLocaleString('pt-PT')}</td>
                <td class="txt-right">${(c.cliques || 0).toLocaleString('pt-PT')}</td>
                <td class="txt-right">${(c.ctr || 0).toFixed(2)}%</td>
                <td class="txt-right">${(c.engagement || 0).toFixed(2)}%</td>
                <td class="txt-right">${(c.conversoes || 0).toLocaleString('pt-PT')}</td>
                <td class="txt-right">€${(c.cpa || 0).toFixed(2)}</td>
                <td class="txt-right ${(c.roi || 0) > 0 ? 'green' : 'red'}">${(c.roi || 0).toFixed(1)}%</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  }

  document.getElementById('content').innerHTML = html;
}

// Carrega dados ao abrir a página
window.addEventListener('load', loadData);
</script>

</body>
</html>
