<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard de Campanhas</title>
<style>
:root {
  --bg: #0f1220; --panel: #191d2e; --panel2: #222740; --line: #2c3251;
  --txt: #e7e9f3; --muted: #9aa0bd; --accent: #5b8cff;
  --green: #37d399; --red: #ff6b6b; --amber: #ffc857;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: var(--bg); color: var(--txt); font-size: 15px; line-height: 1.6; }

header {
  display: flex; align-items: center; gap: 14px; padding: 16px 22px;
  border-bottom: 1px solid var(--line); background: var(--panel);
  position: sticky; top: 0; z-index: 50;
}

header h1 { font-size: 18px; font-weight: 700; margin: 0; }
header .logo { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg, #1877f2, #0a66c2); display: flex; align-items: center; justify-content: center; color: white; font-weight: 800; font-size: 18px; }
.badge { margin-left: auto; background: var(--panel2); border: 1px solid var(--line); padding: 8px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; color: var(--muted); }

main { padding: 22px; max-width: 1200px; margin: 0 auto; }

.info { background: rgba(91, 140, 255, 0.1); border: 1px solid var(--accent); color: var(--accent); padding: 14px; border-radius: 14px; margin-bottom: 20px; font-size: 14px; }

iframe { width: 100%; height: 100vh; border: none; border-radius: 14px; }

.panel {
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 22px;
}

.panel h2 { font-size: 16px; font-weight: 700; margin: 0 0 14px 0; }

.loading { text-align: center; padding: 40px; color: var(--muted); }

table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 14px; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-size: 12px; text-transform: uppercase; font-weight: 600; }
tbody tr:hover { background: var(--panel2); }
.txt-right { text-align: right; }

@media (max-width: 620px) {
  header { flex-wrap: wrap; padding: 12px 14px; }
  header h1 { flex: 1; font-size: 16px; }
  main { padding: 14px; }
}
</style>
</head>
<body>

<header>
  <div class="logo">f</div>
  <h1>Dashboard de Campanhas</h1>
  <div class="badge">📍 Meta Ads</div>
</header>

<main>
  <div class="info">
    💡 Carregando dados da URL: <strong>dashboardmetaads-wheat.vercel.app</strong>
  </div>

  <div id="content">
    <div class="loading">
      <p>Carregando dashboard...</p>
    </div>
  </div>
</main>

<script>
const API_URL = 'https://dashboardmetaads-wheat.vercel.app/dashboard/campanhas';

async function loadData() {
  try {
    // Tenta fetch com diferentes configurações
    const response = await fetch(API_URL, {
      credentials: 'include',
      headers: {
        'Accept': 'application/json, text/plain, */*'
      }
    });

    if (response.status === 403) {
      console.log('403 Forbidden - Tentando alternativas...');
      loadAlternative();
      return;
    }

    if (!response.ok) throw new Error(`Status ${response.status}`);

    const data = await response.json();
    renderData(data);

  } catch (error) {
    console.error('Erro:', error);
    loadAlternative();
  }
}

function loadAlternative() {
  // Se a API não funcionar, mostra a página original em iframe
  document.getElementById('content').innerHTML = `
    <iframe src="${API_URL}" title="Dashboard Original"></iframe>
  `;
}

function renderData(data) {
  const cliente = data.cliente || 'Meta Ads';
  const resumo = data.resumo || {};
  const campanhas = data.campanhas || [];

  document.querySelector('.badge').textContent = `📍 ${cliente}`;

  let html = `
    <div class="panel">
      <h2>📊 KPIs Principais</h2>
      <table>
        <tr>
          <td><strong>Gastos:</strong></td>
          <td class="txt-right">€${(resumo.gastos || 0).toFixed(2)}</td>
        </tr>
        <tr>
          <td><strong>Vendas:</strong></td>
          <td class="txt-right">€${(resumo.vendas || 0).toFixed(2)}</td>
        </tr>
        <tr>
          <td><strong>ROAS:</strong></td>
          <td class="txt-right">${(resumo.roas || 1).toFixed(2)}x</td>
        </tr>
        <tr>
          <td><strong>CPC:</strong></td>
          <td class="txt-right">€${(resumo.cpcMedio || 0).toFixed(2)}</td>
        </tr>
        <tr>
          <td><strong>CTR:</strong></td>
          <td class="txt-right">${(resumo.ctr || 0).toFixed(2)}%</td>
        </tr>
      </table>
    </div>
  `;

  if (campanhas.length > 0) {
    html += `
      <div class="panel">
        <h2>Campanhas</h2>
        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th class="txt-right">Gastos</th>
              <th class="txt-right">Vendas</th>
              <th class="txt-right">ROI</th>
            </tr>
          </thead>
          <tbody>
            ${campanhas.map(c => `
              <tr>
                <td>${c.nome || 'N/A'}</td>
                <td class="txt-right">€${(c.gastos || 0).toFixed(2)}</td>
                <td class="txt-right">€${(c.vendas || 0).toFixed(2)}</td>
                <td class="txt-right">${(c.roi || 0).toFixed(1)}%</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  }

  document.getElementById('content').innerHTML = html;
}

window.addEventListener('load', loadData);
</script>

</body>
</html>
