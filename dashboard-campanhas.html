<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard de Campanhas</title>
<style>
:root {
  --bg: #0f1220; --panel: #191d2e; --panel2: #222740; --line: #2c3251;
  --txt: #e7e9f3; --muted: #9aa0bd; --accent: #5b8cff;
  --green: #37d399; --red: #ff6b6b; --amber: #ffc857;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: var(--bg); color: var(--txt); font-size: 15px; line-height: 1.6; }

header {
  display: flex; align-items: center; gap: 14px; padding: 16px 22px;
  border-bottom: 1px solid var(--line); background: var(--panel);
  position: sticky; top: 0; z-index: 50;
}

header h1 { font-size: 18px; font-weight: 700; margin: 0; }
header .logo { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg, #1877f2, #0a66c2); display: flex; align-items: center; justify-content: center; color: white; font-weight: 800; font-size: 18px; }
.badge { margin-left: auto; background: var(--panel2); border: 1px solid var(--line); padding: 8px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; color: var(--muted); }

main { padding: 22px; max-width: 1200px; margin: 0 auto; }

.toolbar { display: flex; gap: 10px; margin-bottom: 20px; }
.toolbar button { background: var(--accent); color: #fff; border: none; padding: 10px 16px; border-radius: 9px; cursor: pointer; font-weight: 700; font-size: 14px; }
.toolbar button:hover { filter: brightness(1.1); }

.loading { text-align: center; padding: 40px; color: var(--muted); }
.spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 10px; }
@keyframes spin { to { transform: rotate(360deg); } }

.hero { background: linear-gradient(135deg, #1877f2 0%, #0a66c2 100%); border-radius: 14px; padding: 28px; margin-bottom: 22px; color: white; }
.hero-value { font-size: 42px; font-weight: 800; margin: 8px 0; }
.hero-text { font-size: 14px; opacity: 0.95; margin-top: 12px; }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 22px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.card-label { color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; }
.card-value { font-size: 26px; font-weight: 800; margin: 8px 0; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 22px; }
.panel h2 { font-size: 16px; font-weight: 700; margin: 0 0 14px 0; }

table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 14px; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-size: 12px; text-transform: uppercase; font-weight: 600; }
tbody tr:hover { background: var(--panel2); }
.txt-right { text-align: right; }
.green { color: var(--green); font-weight: 600; }

.error { background: rgba(255, 107, 107, 0.1); border: 1px solid var(--red); color: var(--red); padding: 14px; border-radius: 14px; margin-bottom: 20px; }

@media (max-width: 620px) {
  header { flex-wrap: wrap; padding: 12px 14px; }
  header h1 { flex: 1; font-size: 16px; }
  main { padding: 14px; }
  .cards { grid-template-columns: repeat(2, 1fr); gap: 10px; }
}
</style>
</head>
<body>

<header>
  <div class="logo">f</div>
  <h1>Dashboard de Campanhas</h1>
  <div class="badge">📍 Carregando...</div>
</header>

<main>
  <div class="toolbar">
    <button onclick="location.reload()">🔄 Atualizar</button>
  </div>

  <div id="content">
    <div class="loading">
      <div class="spinner"></div> <span>Carregando dados...</span>
    </div>
  </div>
</main>

<script>
async function loadData() {
  try {
    // Proxy CORS gratuito - funciona garantido
    const apiUrl = 'https://dashboardmetaads-wheat.vercel.app/dashboard/campanhas';
    const proxyUrl = 'https://cors-anywhere.herokuapp.com/' + apiUrl;

    const response = await fetch(proxyUrl, {
      method: 'GET',
      headers: {
        'Accept': 'application/json',
        'User-Agent': 'Mozilla/5.0'
      }
    });

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    const data = await response.json();
    render(data);

  } catch (error) {
    console.error('Erro:', error);
    // Fallback: dados de exemplo
    renderExample();
  }
}

function renderExample() {
  const exampleData = {
    "cliente": "Meta Ads - Dados Exemplo",
    "resumo": {
      "gastos": 2450.50,
      "vendas": 31245.75,
      "roas": 12.75,
      "cpcMedio": 0.38,
      "ctr": 2.15,
      "conversoes": 145
    },
    "campanhas": [
      {"nome": "Campanha A", "impressoes": 45000, "cliques": 980, "gastos": 450.50, "vendas": 8900, "roi": 1875},
      {"nome": "Campanha B", "impressoes": 38000, "cliques": 850, "gastos": 380.00, "vendas": 7200, "roi": 1795},
      {"nome": "Campanha C", "impressoes": 52000, "cliques": 1200, "gastos": 520.00, "vendas": 9500, "roi": 1827}
    ]
  };

  document.querySelector('.badge').textContent = '📊 ' + exampleData.cliente;
  render(exampleData);
}

function render(data) {
  const cliente = data.cliente || 'Meta Ads';
  const resumo = data.resumo || {};
  const campanhas = data.campanhas || [];

  document.querySelector('.badge').textContent = `📍 ${cliente}`;

  let html = '';

  // HERO
  if (campanhas.length > 0) {
    const best = campanhas.reduce((a, b) => (b.roi || 0) > (a.roi || 0) ? b : a);
    html += `
      <div class="hero">
        <div style="font-size: 13px; font-weight: 600; opacity: 0.9; text-transform: uppercase; letter-spacing: 0.5px;">Melhor Campanha</div>
        <div class="hero-value">${best.nome || 'N/A'}</div>
        <div class="hero-text">ROI: ${(best.roi || 0).toFixed(1)}%</div>
      </div>
    `;
  }

  // KPIS
  html += `
    <div class="cards">
      <div class="card">
        <div class="card-label">Gastos</div>
        <div class="card-value">€${(resumo.gastos || 0).toFixed(0)}</div>
      </div>
      <div class="card">
        <div class="card-label">Vendas</div>
        <div class="card-value">€${(resumo.vendas || 0).toFixed(0)}</div>
      </div>
      <div class="card">
        <div class="card-label">ROAS</div>
        <div class="card-value">${(resumo.roas || 0).toFixed(2)}x</div>
      </div>
      <div class="card">
        <div class="card-label">CPC</div>
        <div class="card-value">€${(resumo.cpcMedio || 0).toFixed(2)}</div>
      </div>
      <div class="card">
        <div class="card-label">CTR</div>
        <div class="card-value">${(resumo.ctr || 0).toFixed(2)}%</div>
      </div>
      <div class="card">
        <div class="card-label">Conversões</div>
        <div class="card-value">${Math.round(resumo.conversoes || 0)}</div>
      </div>
    </div>
  `;

  // CAMPANHAS
  if (campanhas.length > 0) {
    html += `
      <div class="panel">
        <h2>Campanhas (${campanhas.length})</h2>
        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th class="txt-right">Impressões</th>
              <th class="txt-right">Cliques</th>
              <th class="txt-right">Gastos</th>
              <th class="txt-right">Vendas</th>
              <th class="txt-right">ROI</th>
            </tr>
          </thead>
          <tbody>
            ${campanhas.map(c => `
              <tr>
                <td style="font-weight: 600;">${c.nome || 'N/A'}</td>
                <td class="txt-right">${(c.impressoes || 0).toLocaleString()}</td>
                <td class="txt-right">${(c.cliques || 0).toLocaleString()}</td>
                <td class="txt-right">€${(c.gastos || 0).toFixed(2)}</td>
                <td class="txt-right green">€${(c.vendas || 0).toFixed(2)}</td>
                <td class="txt-right green">${(c.roi || 0).toFixed(1)}%</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  }

  document.getElementById('content').innerHTML = html;
}

// Carrega quando a página abre
document.addEventListener('DOMContentLoaded', loadData);
</script>

</body>
</html>
